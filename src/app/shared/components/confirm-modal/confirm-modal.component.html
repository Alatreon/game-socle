<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p>{{ message }}</p>

  <div class="button-group">
    <ion-button expand="block" fill="outline" (click)="cancel()">
      {{ cancelText }}
    </ion-button>
    <ion-button expand="block" color="danger" (click)="confirm()">
      {{ confirmText }}
    </ion-button>
  </div>
</ion-content>
