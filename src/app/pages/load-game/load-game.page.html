<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'loadGame.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (saves.length === 0) {
  <div class="empty-state">
    <p>{{ 'loadGame.empty' | translate }}</p>
  </div>
  } @else {
  <ion-list>
    @for (save of saves; track save.id) {
    <ion-item-sliding>
      <ion-item button (click)="loadGame(save)">
        <ion-label>
          <h2>{{ save.name }}</h2>
          <p>{{ formatDate(save.creationDate) }} — {{ 'newGame.' + save.difficulty | translate }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteSave(save)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
    }
  </ion-list>
  }
</ion-content>
